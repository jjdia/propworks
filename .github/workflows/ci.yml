name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: build-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck and build
        run: npm run build
        env:
          # Build must succeed without production secrets in CI.
          # Vite only requires these at runtime for sync; empty is fine for typecheck/bundle.
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Run pure-logic test suites
        run: |
          set -euo pipefail
          for f in \
            scripts/persistence-test.ts \
            scripts/installment-test.ts \
            scripts/report-test.ts \
            scripts/lease-template-test.ts \
            scripts/email-template-test.ts \
            scripts/overdue-test.ts \
            scripts/maintenance-schedule-test.ts \
            scripts/admin-access-test.ts
          do
            echo "::group::npx tsx $f"
            npx tsx "$f"
            echo "::endgroup::"
          done
